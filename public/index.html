<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Video Downloader</title>
  <style>
    /* CSS Variables para sa Automatic Theme Sync */
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --input-bg: #f1f5f9;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --badge-bg: rgba(37, 99, 235, 0.1);
      --badge-text: #2563eb;
      --btn-hd: #16a34a;
      --btn-hd-hover: #15803d;
      --btn-sd: #2563eb;
      --btn-sd-hover: #1d4ed8;
      --btn-audio: #d97706;
      --btn-audio-hover: #b45309;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    /* Auto Dark Mode Sync batay sa Mobile/System Settings */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --input-bg: #0f172a;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --badge-bg: rgba(59, 130, 246, 0.15);
        --badge-text: #60a5fa;
        --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; transition: background-color 0.3s, color 0.3s; }
    body { background-color: var(--bg-color); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: var(--text-main); }
    
    .card { background-color: var(--card-bg); width: 100%; max-width: 460px; padding: 32px 28px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
    
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 24px; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; margin-bottom: 6px; }
    .header p { font-size: 14px; color: var(--text-muted); }
    
    .counter-badge { display: inline-flex; align-items: center; gap: 6px; background-color: var(--badge-bg); color: var(--badge-text); font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 99px; margin-top: 12px; }

    .input-box { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    input { width: 100%; padding: 14px 16px; background-color: var(--input-bg); border: 1.5px solid var(--border-color); border-radius: 12px; font-size: 14px; color: var(--text-main); outline: none; transition: border-color 0.2s; }
    input:focus { border-color: var(--primary); }
    input::placeholder { color: var(--text-muted); }
    
    button { width: 100%; background-color: var(--primary); color: #ffffff; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; }
    button:hover { background-color: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .spinner { display: none; width: 32px; height: 32px; border: 3px solid var(--border-color); border-top: 3px solid var(--primary); border-radius: 50%; margin: 24px auto; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .result { display: none; border-top: 1px solid var(--border-color); padding-top: 24px; margin-top: 12px; }
    .thumb { width: 100%; border-radius: 12px; object-fit: cover; max-height: 220px; margin-bottom: 14px; background-color: var(--input-bg); border: 1px solid var(--border-color); }
    .title { font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 18px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .download-btns { display: flex; flex-direction: column; gap: 10px; }
    .dl-btn { text-decoration: none; display: flex; justify-content: center; align-items: center; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #ffffff; text-align: center; transition: opacity 0.2s; }
    .dl-btn:hover { opacity: 0.9; }
    .btn-hd { background-color: var(--btn-hd); }
    .btn-sd { background-color: var(--btn-sd); }
    .btn-audio { background-color: var(--btn-audio); }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>FB Video Downloader</h1>
    <p>I-paste ang Facebook video link para ma-download agad.</p>
    <div class="counter-badge" id="counterBadge">Total Downloads: 0</div>
  </div>

  <div class="input-box">
    <input type="url" id="fbUrl" placeholder="https://www.facebook.com/watch/?v=..." required />
    <button id="btnFetch" onclick="fetchVideo()">Get Video</button>
  </div>

  <div class="spinner" id="spinner"></div>

  <div class="result" id="resultBox">
    <img id="thumb" class="thumb" src="" alt="Video Thumbnail" />
    <div id="videoTitle" class="title"></div>
    <div class="download-btns" id="btnGroup"></div>
  </div>
</div>

<script>
// Load count sa page load
async function loadCounter() {
  try {
    const res = await fetch('/api/download');
    const data = await res.json();
    if (data.success) {
      document.getElementById('counterBadge').innerText = `Total Downloads: ${data.count.toLocaleString()}`;
    }
  } catch (err) {
    document.getElementById('counterBadge').innerText = 'Total Downloads: 0';
  }
}
loadCounter();

async function fetchVideo() {
  const urlInput = document.getElementById('fbUrl');
  const btnFetch = document.getElementById('btnFetch');
  const spinner = document.getElementById('spinner');
  const resultBox = document.getElementById('resultBox');
  const btnGroup = document.getElementById('btnGroup');

  const url = urlInput.value.trim();
  if(!url) return alert('Paki-paste muna ang Facebook video URL.');

  btnFetch.disabled = true;
  spinner.style.display = 'block';
  resultBox.style.display = 'none';

  try {
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });

    const data = await res.json();

    if (data.success) {
      document.getElementById('thumb').src = data.thumbnail || 'https://via.placeholder.com/480x270?text=No+Thumbnail';
      document.getElementById('videoTitle').innerText = data.title;

      if (data.totalDownloads !== undefined) {
        document.getElementById('counterBadge').innerText = `Total Downloads: ${data.totalDownloads.toLocaleString()}`;
      }

      let linksHTML = '';
      if (data.downloads.hd) {
        linksHTML += `<a class="dl-btn btn-hd" href="${data.downloads.hd}" target="_blank" rel="noopener noreferrer" download="${data.title}_HD.mp4">Download HD Video</a>`;
      }
      if (data.downloads.sd) {
        linksHTML += `<a class="dl-btn btn-sd" href="${data.downloads.sd}" target="_blank" rel="noopener noreferrer" download="${data.title}_SD.mp4">Download SD Video</a>`;
      }
      
      const audioUrl = data.downloads.sd || data.downloads.hd;
      if (audioUrl) {
        linksHTML += `<a class="dl-btn btn-audio" href="${audioUrl}" target="_blank" rel="noopener noreferrer">Stream / Save Audio Link</a>`;
      }

      btnGroup.innerHTML = linksHTML;
      resultBox.style.display = 'block';
    } else {
      // Ipakita ang totoong error mula sa API response
      alert("API Error: " + (data.message || 'May error sa pag-extract ng video.'));
    }
  } catch (err) {
    // Ipakita ang eksaktong JS exception message
    alert('Request Failed: ' + err.message);
  } finally {
    btnFetch.disabled = false;
    spinner.style.display = 'none';
  }
}
</script>

</body>
</html>
