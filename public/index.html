<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #ffffff; width: 100%; max-width: 480px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 22px; color: #1877f2; margin-bottom: 6px; }
    .header p { font-size: 13px; color: #65676b; }
    
    .counter-badge { display: inline-block; background: #e7f3ff; color: #1877f2; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; margin-top: 8px; }

    .input-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px 14px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #1877f2; }
    button { background: #1877f2; color: #fff; border: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #166fe5; }
    button:disabled { background: #90bbf8; cursor: not-allowed; }
    
    .spinner { display: none; width: 32px; height: 32px; border: 3px solid #f3f3f3; border-top: 3px solid #1877f2; border-radius: 50%; margin: 20px auto; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .result { display: none; border-top: 1px solid #e4e6eb; padding-top: 20px; margin-top: 10px; }
    .thumb { width: 100%; border-radius: 8px; object-fit: cover; max-height: 240px; margin-bottom: 12px; background: #e4e6eb; }
    .title { font-size: 14px; font-weight: 600; color: #050505; margin-bottom: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .download-btns { display: flex; flex-direction: column; gap: 10px; }
    .dl-btn { text-decoration: none; display: flex; justify-content: center; align-items: center; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 600; color: #fff; text-align: center; }
    .btn-hd { background: #42b72a; }
    .btn-hd:hover { background: #36a420; }
    .btn-sd { background: #1877f2; }
    .btn-sd:hover { background: #166fe5; }
    .btn-audio { background: #f5a623; }
    .btn-audio:hover { background: #e0961f; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>FB Video Downloader</h1>
    <p>I-paste ang Facebook video/reel link para ma-download agad.</p>
    <div class="counter-badge" id="counterBadge">Total Downloads: 0</div>
  </div>

  <div class="input-box">
    <input type="url" id="fbUrl" placeholder="https://www.facebook.com/watch/?v=..." required />
    <button id="btnFetch" onclick="fetchVideo()">Get Video</button>
  </div>

  <div class="spinner" id="spinner"></div>

  <div class="result" id="resultBox">
    <img id="thumb" class="thumb" src="" alt="Video Thumbnail" />
    <div id="videoTitle" class="title"></div>
    <div class="download-btns" id="btnGroup"></div>
  </div>
</div>

<script>
// Load count sa page load (0 kung bago)
async function loadCounter() {
  try {
    const res = await fetch('/api/download');
    const data = await res.json();
    if (data.success) {
      document.getElementById('counterBadge').innerText = `Total Downloads: ${data.count.toLocaleString()}`;
    }
  } catch (err) {
    document.getElementById('counterBadge').innerText = 'Total Downloads: 0';
  }
}
loadCounter();

async function fetchVideo() {
  const urlInput = document.getElementById('fbUrl');
  const btnFetch = document.getElementById('btnFetch');
  const spinner = document.getElementById('spinner');
  const resultBox = document.getElementById('resultBox');
  const btnGroup = document.getElementById('btnGroup');

  const url = urlInput.value.trim();
  if(!url) return alert('Paki-paste muna ang Facebook video URL.');

  btnFetch.disabled = true;
  spinner.style.display = 'block';
  resultBox.style.display = 'none';

  try {
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });

    const data = await res.json();

    if (data.success) {
      document.getElementById('thumb').src = data.thumbnail || 'https://via.placeholder.com/480x270?text=No+Thumbnail';
      document.getElementById('videoTitle').innerText = data.title;

      if (data.totalDownloads !== undefined) {
        document.getElementById('counterBadge').innerText = `Total Downloads: ${data.totalDownloads.toLocaleString()}`;
      }

      let linksHTML = '';
      if (data.downloads.hd) {
        linksHTML += `<a class="dl-btn btn-hd" href="${data.downloads.hd}" target="_blank" rel="noopener noreferrer" download="${data.title}_HD.mp4">Download HD Video</a>`;
      }
      if (data.downloads.sd) {
        linksHTML += `<a class="dl-btn btn-sd" href="${data.downloads.sd}" target="_blank" rel="noopener noreferrer" download="${data.title}_SD.mp4">Download SD Video</a>`;
      }
      
      const audioUrl = data.downloads.sd || data.downloads.hd;
      if (audioUrl) {
        linksHTML += `<a class="dl-btn btn-audio" href="${audioUrl}" target="_blank" rel="noopener noreferrer">Stream / Save Audio Link</a>`;
      }

      btnGroup.innerHTML = linksHTML;
      resultBox.style.display = 'block';
    } else {
      alert(data.message || 'May error sa pag-extract ng video.');
    }
  } catch (err) {
    alert('Failed to connect to the server. Please check your network connection.');
  } finally {
    btnFetch.disabled = false;
    spinner.style.display = 'none';
  }
}
</script>

</body>
</html>
